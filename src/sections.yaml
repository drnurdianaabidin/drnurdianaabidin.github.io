# ---------------------------------------------------------------
# SECTIONS AND CATEGORIES
# Each section has a title, a one-line description, and a list of
# categories. Every piece of work must use one of the categories
# listed for its section, spelled exactly the same way.
#
# To add a category: add a new line starting with "- ".
# To rename one: change it here AND in any work that uses it.
# Do not change the four section keys (academic, research,
# community, industry) as they match the folder names.
# ---------------------------------------------------------------

academic:
  title: Academic
  description: Teaching, postgraduate supervision, programme leadership and digital learning tools in clinical exercise science at Universiti Sains Malaysia.
  categories:
    - Teaching
    - Teaching innovation
    - Postgraduate supervision
    - Curriculum and programme development
    - Leadership and service
    - Invited lectures
    - Awards

research:
  title: Research
  description: Studies of muscle, bone, fat and physical activity as people age, and of exercise and recovery.
  categories:
    - Publications
    - Current projects
    - Past projects
    - Grants
    - Conference presentations

community:
  title: Community
  description: Healthy ageing programmes, community health projects and writing for the public in Malaysia.
  categories:
    - Health outreach
    - Public talks
    - Community programmes
    - Articles for the public
    - Media appearances

industry:
  title: Industry
  description: Collaborations with organisations outside the university, and registered intellectual property.
  categories:
    - Partnerships
    - Consultancy
    - Workshops and training
    - Collaborative projects
    - Intellectual property
