# The invitation to prospective students
invitation:
  title: Interested in Pursuing Research With Me?
  text:
    - I welcome enquiries from prospective master's and PhD students who are curious, committed, and excited about meaningful research. My work brings together exercise physiology, musculoskeletal health, ageing, rehabilitation and digital health technologies.
    - Whether you have a clearly developed research idea or are still exploring a topic, I would be happy to hear about your interests and discuss whether they align with my current research directions.
  interests:
    - Sarcopenia and Muscle Health
    - Osteoporosis and Bone Health
    - Exercise Physiology
    - Healthy Ageing
    - Dementia and Mild Cognitive Impairment
    - Virtual Reality and Exercise Rehabilitation
    - Digital Health and AI in Clinical Exercise Science
    - Exercise Interventions and Functional Performance
    - Microneedle Technology and Research Translation
  button: Enquire About Research Supervision
  subject: Prospective MSc/PhD Research Supervision Enquiry
  # What to put in the email. These lines are also filled into the email.
  include:
    - Full name
    - Intended programme (MSc by Research / PhD)
    - Academic background and qualifications
    - Research interests or proposed topic
    - Expected start date
    - CV and brief research proposal, if available
  note: Supervision depends on how well a project aligns with my research, my supervisory capacity at the time, and the university's admission requirements. An enquiry does not guarantee a place, a scholarship or funding.
