title: Postgraduate Research Supervision
introduction: Supervising postgraduate researchers is one of the most rewarding aspects of my academic career. I enjoy helping students develop their research questions, navigate the challenges of scientific inquiry, and grow into confident, independent researchers. My supervisory interests span exercise physiology, musculoskeletal health, healthy ageing, rehabilitation, and emerging technologies in healthcare.
university: Universiti Sains Malaysia

