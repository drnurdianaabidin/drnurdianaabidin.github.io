# Your position, shown above your name on the home page.
designation: Senior Lecturer, Pusat Kanser Tun Abdullah Ahmad Badawi (PKTAAB)

# One or two sentences introducing your research, shown below the menu on the
# home page.
introduction: My research brings together exercise physiology, biomedical science, computational approaches and emerging technologies to better understand and support musculoskeletal health and healthy ageing.

# One or two sentences used by search engines and in shared link previews.
description: Dr Nurdiana Zainol Abidin is a Senior Lecturer at Pusat Kanser Tun Abdullah Ahmad Badawi (PKTAAB), Universiti Sains Malaysia, researching musculoskeletal ageing, sarcopenia, osteosarcopenic obesity, clinical exercise science, and machine learning for musculoskeletal screening.

# Your institutional email address. It appears on the Contact page and at
