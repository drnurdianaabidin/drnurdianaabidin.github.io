email: nurdianaabidin@usm.my

# A sentence or two shown above your email address on the Contact page.
contactNote: I welcome research collaborations in musculoskeletal ageing, exercise physiology, clinical prediction modelling, digital health and translational biomedical innovation. Prospective postgraduate students and potential partners are welcome to write by email.

